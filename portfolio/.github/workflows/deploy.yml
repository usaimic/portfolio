name: Deploy su GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configura Pages
        uses: actions/configure-pages@v6

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v5
